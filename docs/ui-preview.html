<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LitMedia Flow 的寬版與窄版桌面截圖，包含簽到排程、登入流程、帳號與 GitHub 設定。">
  <title>LitMedia Flow 介面預覽</title>
  <style>
    /* Hallmark | LitMedia Flow | Native desktop captures */
    /* The desktop program supplies every view and its compact layout. */
    :root {
      color-scheme: light;
      --canvas: #f2f7fa;
      --surface: #f9fcfd;
      --ink: #142f40;
      --muted: #4b6575;
      --accent: #006b76;
      --line: #d4e1e7;
      --type: Inter, "PingFang TC", "Microsoft JhengHei UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { overflow-x: clip; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font: 1rem/1.55 var(--type); }
    main { max-width: 76rem; margin-inline: auto; padding: clamp(1rem, 4vw, 3rem); }
    h1, h2 { margin: 0; line-height: 1.25; overflow-wrap: break-word; text-wrap: balance; }
    h1 { font-size: clamp(1.6rem, 4vw, 2.6rem); }
    h2 { font-size: 1.25rem; margin-bottom: .75rem; }
    p { color: var(--muted); margin: .5rem 0; }
    nav { display: flex; flex-wrap: wrap; gap: .25rem 1.5rem; }
    a { color: var(--accent); text-underline-offset: .2em; }
    nav a { display: inline-flex; align-items: center; min-height: 44px; }
    a:active { color: var(--ink); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    section { margin-top: 2rem; scroll-margin-top: 1rem; }
    picture { display: block; }
    img { display: block; width: 100%; height: auto; background: var(--surface); border: 1px solid var(--line); border-radius: .6rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>LitMedia Flow 介面預覽</h1>
      <p>以下為桌面程式截圖。執行結果為擷取當時的資料，帳號別名已隱藏。</p>
      <nav aria-label="檢視畫面">
        <a href="#dashboard">簽到總覽</a><a href="#login">建立登入狀態</a>
        <a href="#accounts">帳號設定</a><a href="#guide">GitHub 設定指引</a>
      </nav>
    </header>
    <section id="dashboard">
      <h2>簽到總覽</h2>
      <picture>
        <source media="(max-width: 740px)" srcset="ui/dashboard-compact.webp" width="600" height="640">
        <img src="ui/dashboard.webp" width="1220" height="820" fetchpriority="high" alt="每日簽到排程、四項統計、執行歷史及各帳號的簽到結果。">
      </picture>
    </section>
    <section id="login">
      <h2>建立登入狀態</h2>
      <picture>
        <source media="(max-width: 740px)" srcset="ui/login-compact.webp" width="600" height="640">
        <img src="ui/login.webp" width="1220" height="820" loading="lazy" alt="選擇帳號與瀏覽器、開啟登入流程，並將已儲存的狀態寫入 GitHub Secret。">
      </picture>
    </section>
    <section id="accounts">
      <h2>帳號設定</h2>
      <picture>
        <source media="(max-width: 740px)" srcset="ui/accounts-compact.webp" width="600" height="640">
        <img src="ui/accounts.webp" width="1220" height="820" loading="lazy" alt="依帳號編號編輯本機別名，再儲存設定。">
      </picture>
    </section>
    <section id="guide">
      <h2>GitHub 設定指引</h2>
      <picture>
        <source media="(max-width: 740px)" srcset="ui/guide-compact.webp" width="600" height="640">
        <img src="ui/guide.webp" width="1220" height="820" loading="lazy" alt="四個步驟說明如何從本機登入到檢查 GitHub Actions 執行紀錄。">
      </picture>
    </section>
  </main>
</body>
</html>
